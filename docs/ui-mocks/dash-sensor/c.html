<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard Sensor — C. Summary and grid</title><link rel="stylesheet" href="../world-dm/shared.css"><link rel="stylesheet" href="dash.css"></head><body>
<script src="../world-dm/shared.js"></script><script src="dash.js"></script>
<script>
const nt = (label, hint, v) => `<div class="ntile"><span>${label}</span>${hint ? `<span class="cap">${hint}</span>` : ''}<input class="num" type="number" value="${v}" aria-label="${label}"></div>`
mountDash({ label: 'C · Summary + grid', blurb: 'A “current setup” card on top, numbers as a tile grid with short labels (copy changes), switches stay rows', html:
  `<section class="card sumcard t-sky"><b>Current setup</b><div class="chips">${chip('Sensor mode', 'sky')}${chip('chat’s model', 'sky')}${chip('insert on · 80 tokens', 'violet')}${chip('7 of 7 groups', 'teal')}${chip('2 main · 4 side quests', 'pink')}</div>${D.use()}</section>` +
  dsec('sky', 'eye', 'How it works', ['Sensor'], D.mode() + D.model() + D.catchUp() + D.autoSoul()) +
  dsec('violet', 'spark', 'What the model is reminded of', ['insert on', 'said: on'], D.insert() + D.saidInject() + `<div class="grid2">${nt('Tokens per character', '', 80)}${nt('Notes stay in the insert (turns)', '5 to 500', 30)}${nt('Said per turn, at most', '1 to 4', 1)}${nt('Sensor reply limit (tokens)', 'raise only if replies get cut off', 1200)}</div><div><p class="subh">Event groups</p><div class="tchips">${D.groups(5)}</div></div>`) +
  dsec('pink', 'compass', 'Quests', ['2 main', '4 side'], `<div class="grid2">${nt('Main quests at most', '1 to 2', 2)}${nt('Side quests at most', '1 to 6', 4)}${nt('Steps per main quest', 'at most', 4)}${nt('Everyday quests end after (turns)', '0 = never', 8)}${nt('Ask to close after (old-quest checks)', '0 = never', 3)}${nt('Check old quests every (turns)', '0 = never', 5)}</div>`) +
  D.prompts()
})
</script></body></html>
