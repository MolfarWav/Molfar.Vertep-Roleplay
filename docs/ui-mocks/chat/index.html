<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat — three variants</title>
<style>
body{margin:0;background:#101010;color:#e6e6e6;font:14px/20px system-ui,sans-serif}
header{padding:16px 24px;border-bottom:1px solid #333;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header a{color:#ddd;background:#262626;border:1px solid #444;border-radius:6px;padding:4px 10px;text-decoration:none}header a.on{background:#e6e6e6;color:#111}
.v{padding:24px;border-bottom:1px solid #333}.v h2{margin:0 0 4px;font-size:16px}.v p{margin:0 0 12px;color:#aaa;max-width:80ch}
.frames{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.f{border:1px solid #444;border-radius:8px;overflow:hidden;background:#000}.f small{display:block;padding:4px 8px;color:#aaa;font-size:12px}
.f iframe{border:0;display:block;background:#fff}
.d{width:640px;height:640px}.d iframe{width:1280px;height:1280px;transform:scale(.5);transform-origin:0 0}
.m iframe{width:390px;height:844px}
</style></head><body>
<header><h1>Chat screen — three variants (mocks, real tokens)</h1><span id="th"></span></header>
<div id="list"></div>
<script>
const theme=new URLSearchParams(location.search).get('theme')||'dark'
th.innerHTML=['dark','light'].map(t=>`<a class="${t===theme?'on':''}" href="?theme=${t}">${t}</a>`).join(' ')
const V=[['x1','X1 · Clean header, weighted moves','One context chip in the header says what is active (preset, persona, model) and opens the switcher; the composer moves follow the button ladder (Send primary, Continue tonal, Write for me outline, Polish ghost); Another is removed (Regenerate lives under the reply). Closest to today, least risk.'],['x2','X2 · Context strip','The header keeps only who and the essentials; a strip of four tappable cards under it shows preset, persona, model and agents and opens each list directly. Moves sit above the input. Most visible context, costs 64 px of height.'],['x3','X3 · Immersive','The chat background shows through, a slim glass header, a floating composer, the context behind one labelled button in a sheet. Prettiest and calmest, but the context is one extra step away.']]
list.innerHTML=V.map(([k,t,d])=>`<section class="v"><h2>${t}</h2><p>${d}</p><div class="frames"><div class="f d"><small>1280 px (open full: <a style="color:#9cf" href="${k}.html?theme=${theme}">${k}.html</a>)</small><iframe src="${k}.html?theme=${theme}&bare=1" style="height:1280px"></iframe></div><div class="f m"><small>390 px</small><iframe src="${k}.html?theme=${theme}&bare=1"></iframe></div></div></section>`).join('')
</script></body></html>
