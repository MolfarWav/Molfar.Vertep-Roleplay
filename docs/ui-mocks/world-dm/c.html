<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>World DM — C. Task cards</title><link rel="stylesheet" href="shared.css"></head><body>
<script src="shared.js"></script>
<script>
const card = (tone, ic, title, chips, body) => `<section class="card tcard t-${tone}"><div class="thead">${icon(ic)}<h3>${title}</h3><div class="chips">${chips.map((c) => chip(c, tone)).join('')}</div></div><div class="rows">${body}</div></section>`
mount({
  label: 'C · Task cards',
  blurb: 'Regrouped by what the player wants; value chips; expert numbers fold with a summary',
  settingsHTML:
    card('sky', 'clock', 'When it runs', ['every 3 replies', 'next in 2'], S.everyN() + S.turnBtn() + S.still() + S.skip() + S.place()) +
    card('emerald', 'book', 'What it writes', ['records every 5', '800 characters'], S.recEvery() + S.outfit() +
      fold({ id: 'limits', title: 'Limits', summary: '800 characters · 8 changes per run', cls: 'flat', body: `<div class="rows">${S.textMax()}${S.changesMax()}</div>` })) +
    card('violet', 'spark', 'What it adds to the story', ['events on', 'dice: hint'], S.insert() + S.diceMode() +
      fold({ id: 'dice', title: 'Dice details', summary: 'By the action · even luck · 30% of replies · world 10%', cls: 'flat', body: `<div class="rows">${S.diceStat()}${S.diceTilt()}${S.diceChance()}${S.diceShow()}${S.diceLife()}</div>` }) + S.rolls('flat'))
})
</script></body></html>
