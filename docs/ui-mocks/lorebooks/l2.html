<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lorebooks — L2 Shelf and book page</title><link rel="stylesheet" href="../world-dm/shared.css"><link rel="stylesheet" href="lore.css"></head><body>
<script src="../world-dm/shared.js"></script><script src="lore.js"></script>
<script>
const q = new URLSearchParams(location.search)
const cards = BOOKS.map(([n, tone, e, use, tok, h, own]) => `<button class="bc t-${tone}"><span class="top">${icon('book')}${use === 'Global' ? chip('Global', 'amber') : ''}</span><span class="in"><b>${n}</b><span class="cap">${e} entries · ${tok} tokens</span><span class="cap">${use}</span><span class="avs"><span class="pt" style="--h:${h}">${n[0]}</span><span class="pt" style="--h:${(h + 80) % 360}">${n[1]}</span></span></span></button>`).join('') + `<button class="bc new t-emerald" type="button">${icon('plus')}New lorebook<span class="cap" style="color:var(--ti)">or let Molfar draft one</span></button>`
const shelf = `<div class="frame"><div class="tag">Step 1: the shelf (the Lorebooks page)</div><div class="page2"><div class="tool"><h2 style="font:400 var(--fs-title)/var(--lh-title) var(--font-heading)">Lorebooks <span class="cnt">23</span></h2><span class="sp"></span><button class="btn" type="button">${icon('up')}Import</button><button class="btn ghost" type="button">${icon('spark')}With Molfar</button><button class="btn tonal" type="button">${icon('plus')}New lorebook</button></div><div class="tool"><div class="srch" style="max-width:360px">${icon('search')}Search books…</div><div class="fchips"><button class="fc t-sky" aria-pressed="true">All <span class="n">23</span></button><button class="fc t-amber" aria-pressed="false">Global <span class="n">3</span></button><button class="fc t-violet" aria-pressed="false">Own <span class="n">9</span></button><button class="fc t-teal" aria-pressed="false">Shared <span class="n">8</span></button><button class="fc" aria-pressed="false">Not linked <span class="n">3</span></button></div></div><div class="shelf">${cards}</div></div></div>`
const page = `<div class="frame" style="margin-top:20px"><div class="tag">Step 2: a book (a click on a card)</div><div class="page2" style="padding:0"><div style="padding:12px 20px 0"><button class="backl" type="button">${icon('back')}All lorebooks</button></div><div class="detail" style="overflow:visible">${bookHead(TABS, 0)}<div class="dbody">${entriesTab()}</div></div></div></div>`
pageBase('L2 · Shelf and book page', 'Books as cards you can see (who uses them, global or not); a click opens the book on its own page with the same tabs and the same side panel for an entry', `<div class="page2">${shelf}${page}</div>`)
</script></body></html>
