<!doctype html>
<html lang="en" class="dark bg-background">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<!-- Mobile keyboard contract: the keyboard must shrink the layout viewport
     itself. With the browser default (resizes-visual) the whole page pans up
     behind the keyboard instead of the chat resizing — the composer ends up
     buried and the top bar pushed off screen while typing. -->
<!-- Body is position:fixed (see globals.css) — combined with this meta the
     full column (top bar → chat → composer) refits inside the visible area
     with the keyboard open. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<title>Roleplay — Molfar Vertep</title>
<link rel="icon" type="image/png" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body class="font-sans antialiased">
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
